<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SoulGate Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <!-- ─── Header ─────────────────────────────────────────────── -->
  <header class="header">
    <div class="header-logo">
      <span class="logo-mark">SG</span>
      SoulGate
    </div>
    <div class="header-spacer"></div>
    <div class="header-status">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusLabel">Connecting…</span>
    </div>
    <div class="header-uptime">
      uptime: <span id="uptimeDisplay">--</span>
    </div>
    <div class="refresh-pulse" id="refreshPulse"></div>
  </header>

  <!-- ─── Sidebar ─────────────────────────────────────────────── -->
  <aside class="sidebar">

    <!-- Stats -->
    <div class="sidebar-section">
      <div class="section-label">Gateway Status</div>
      <div class="status-grid">
        <div class="stat-card">
          <div class="stat-value accent-blue" id="statClients">--</div>
          <div class="stat-label">Clients</div>
        </div>
        <div class="stat-card">
          <div class="stat-value accent-green" id="statSessions">--</div>
          <div class="stat-label">Sessions</div>
        </div>
        <div class="stat-card">
          <div class="stat-value accent-purple" id="statAgents">--</div>
          <div class="stat-label">Agents</div>
        </div>
        <div class="stat-card">
          <div class="stat-value accent-yellow" id="statChannels">--</div>
          <div class="stat-label">Channels</div>
        </div>
      </div>
    </div>

    <!-- Provider info -->
    <div class="sidebar-section">
      <div class="section-label">Configuration</div>
      <div class="provider-row">
        <span class="provider-key">Provider</span>
        <span class="provider-val highlight" id="providerName">--</span>
      </div>
      <div class="provider-row">
        <span class="provider-key">Model</span>
        <span class="provider-val" id="providerModel">--</span>
      </div>
      <div class="provider-row">
        <span class="provider-key">Port</span>
        <span class="provider-val" id="providerPort">--</span>
      </div>
    </div>

    <!-- Connected clients -->
    <div class="sidebar-section">
      <div class="section-label">Connected Clients</div>
      <div class="client-list" id="clientList">
        <div class="empty-state">Loading…</div>
      </div>
    </div>

  </aside>

  <!-- ─── Main: Chat ───────────────────────────────────────────── -->
  <main class="main">
    <div class="chat-container">

      <div class="chat-header">
        <span class="chat-title">Live Chat</span>
        <span class="chat-subtitle">— POST /api/chat</span>
      </div>

      <div class="chat-messages" id="chatMessages">
        <!-- Messages injected by JS -->
        <div class="typing-indicator" id="typingIndicator">
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
        </div>
      </div>

      <div class="chat-input-area">
        <textarea
          class="chat-input"
          id="chatInput"
          rows="1"
          placeholder="Send a message… (Enter to send, Shift+Enter for newline)"
        ></textarea>
        <button class="send-btn" id="sendBtn" title="Send (Enter)">&#9658;</button>
      </div>

    </div>
  </main>

  <!-- ─── Aside: Activity + Sessions ──────────────────────────── -->
  <aside class="aside">

    <!-- Recent Activity -->
    <div class="aside-panel">
      <div class="aside-panel-header">
        <span class="aside-panel-title">Recent Activity</span>
        <span class="badge" id="activityBadge">0</span>
      </div>
      <div class="activity-list" id="activityList">
        <div class="empty-state">Loading…</div>
      </div>
    </div>

    <!-- Sessions -->
    <div class="aside-panel">
      <div class="aside-panel-header">
        <span class="aside-panel-title">Sessions</span>
        <span class="badge" id="sessionBadge">0</span>
      </div>
      <div class="session-list" id="sessionList">
        <div class="empty-state">Loading…</div>
      </div>
    </div>

  </aside>

</div>
<script src="app.js"></script>
</body>
</html>
