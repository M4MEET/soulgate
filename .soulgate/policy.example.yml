# ═══════════════════════════════════════════════════════════
# SoulGate Security Policy Template
# Copy this to policy.yml and customize for your needs
# ═══════════════════════════════════════════════════════════

version: "1"

# Default policy: allow workspace reads, deny everything else
# This is a SECURE DEFAULT - only allows reading within workspace

policies:
  # ┌─────────────────────────────────────────────────────────┐
  # │ ALLOW RULES (Workspace Access)                          │
  # └─────────────────────────────────────────────────────────┘

  - name: "allow-workspace-reads"
    description: "Allow reading files within the workspace"
    action: "files.read"
    resource: "./**"
    decision: allow
    priority: 100

  - name: "allow-workspace-list"
    description: "Allow listing directories within the workspace"
    action: "files.list"
    resource: "./**"
    decision: allow
    priority: 100

  - name: "allow-workspace-stat"
    description: "Allow stat operations within the workspace"
    action: "files.stat"
    resource: "./**"
    decision: allow
    priority: 100

  # ┌─────────────────────────────────────────────────────────┐
  # │ DENY RULES (Security Boundaries)                        │
  # └─────────────────────────────────────────────────────────┘

  - name: "deny-parent-access"
    description: "Deny access to parent directories"
    action: "files.*"
    resource: "../**"
    decision: deny
    priority: 200  # Higher priority = evaluated first

  - name: "deny-absolute-paths"
    description: "Deny absolute paths outside workspace"
    action: "files.*"
    resource: "/**"
    decision: deny
    priority: 200

  # ┌─────────────────────────────────────────────────────────┐
  # │ OPTIONAL: Write Access (UNCOMMENT TO ENABLE)            │
  # └─────────────────────────────────────────────────────────┘

  # Uncomment to allow writing files (REQUIRES APPROVAL)
  # - name: "allow-workspace-writes"
  #   description: "Allow writing files with approval"
  #   action: "files.write"
  #   resource: "./**"
  #   decision: allow
  #   priority: 100
  #   require_approval: true

  # ┌─────────────────────────────────────────────────────────┐
  # │ OPTIONAL: Network Access (UNCOMMENT TO ENABLE)          │
  # └─────────────────────────────────────────────────────────┘

  # Uncomment to allow specific API access
  # - name: "allow-github-api"
  #   description: "Allow GitHub API access"
  #   action: "net.request"
  #   resource: "https://api.github.com/**"
  #   decision: allow
  #   priority: 100

  # ┌─────────────────────────────────────────────────────────┐
  # │ OPTIONAL: Command Execution (DANGER - USE WITH CARE)    │
  # └─────────────────────────────────────────────────────────┘

  # DO NOT UNCOMMENT unless you understand the security risks
  # - name: "allow-safe-commands"
  #   description: "Allow safe read-only commands"
  #   action: "exec.command"
  #   resource: "ls|cat|grep|find"  # Whitelist only
  #   decision: allow
  #   priority: 100
  #   require_approval: true

# ═══════════════════════════════════════════════════════════
# SECURITY BEST PRACTICES:
#
# 1. Start with DENY by default
# 2. Explicitly ALLOW only what's needed
# 3. Use priority to ensure DENY rules run first (higher number)
# 4. Test policies with: soulgate policy check <path>
# 5. Review audit logs regularly: soulgate audit query
# 6. Never allow execution without approval
# ═══════════════════════════════════════════════════════════
